        release_args: ["-O3", "-arch=sm_80"]
      env: {}
    runtime:
      backend: cuda
      target_arch: sm_80
      wavefront_size: 32
      compute_units: 108
      matrix_instructions: WMMA
      max_workgroup_size: 1024
    operators:
      gemm:
        baseline: torch._scaled_mm
        custom_route: Triton tl.dot with async cp.async
    profiling:
      telemetry_commands: [nvidia-smi]
      profiler: nsys
      launch_args: ["stats", "--report", "csv"]
      artifact_globs: ["*.csv"]
      captures: {}
      key_counters: []
      clock_policy:
        automatic_change: false
    validation_rules:
      - Reject a device whose compute capability is not sm_80-compatible.
