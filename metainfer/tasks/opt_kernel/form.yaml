# Question bank for the `opt-kernel` task type (invoked as `/metainfer opt-kernel`).

- key: operator
  question: "Which operator should the kernel implement?"
  header: "Operator"
  required: true
  multi: false
  options:
    - label: "Attention"
      description: "MHA / MQA / GQA / MLA, with or without KV cache"
    - label: "Quantized GEMM"
      description: "int4/int8/fp8 weight GEMM"
    - label: "W8A8 GEMM"
      description: "int8 weight × int8 activation scaled GEMM (per-token/per-channel scale, CUDA Graph compatible)"
    - label: "RMSNorm / LayerNorm"
      description: "Normalization layers"
    - label: "RoPE"
      description: "Rotary positional embedding"

- key: kernel_language
  question: "Which kernel language / stack?"
  header: "Stack"
  required: true
  multi: false
  default: "cuda"
  options:
    - label: "CUDA C++"
      description: "Hand-written .cu with torch extension"
    - label: "Triton"
      description: "Python-traced, JIT compiled"
    - label: "CUTLASS"
      description: "C++ template library"
    - label: "HIP"
      description: "AMD ROCm"

- key: target_hardware
  question: "Target GPU?"
  header: "Hardware"
  required: true
  multi: false
  options:
    - label: "K100AI / K500SM (DCU)"
      description: "Hygon DCU, DTK/HIP"
    - label: "H100 (SM 90)"
      description: "TMA, wgmma, fp8"
    - label: "A100 (SM 80)"
      description: "Ampere, async cp"
    - label: "RTX 4090 (SM 89)"
      description: "Consumer Ada"
    - label: "MI300 (CDNA3)"
      description: "AMD ROCm"

- key: input_shapes
  question: "What are the primary input shapes the kernel must be tuned for? (free text, e.g. M=4096,N=4096,K=4096 or batch=8,seq=2048,heads=32,head_dim=128)"
  header: "Shapes"
  required: true
  default: "K=4096,N=4096 (decode M≤32 + prefill M=4096)"

- key: gemm_config
  question: "GEMM configuration (for W8A8 / Quantized GEMM)"
  header: "GEMM config"
  required: false
  multi: true
  options:
    - label: "CUDA Graph compatible"
      description: "Kernel must be capturable into a CUDA Graph (no host-side allocation, static shapes)"
    - label: "Python callable"
      description: "Kernel exposed as a Python function (torch extension or Triton JIT)"
    - label: "TP=4"
      description: "Optimize for tensor-parallel=4 (per-rank N is split by 4)"
    - label: "TP=8"
      description: "Optimize for tensor-parallel=8 (per-rank N is split by 8)"
    - label: "Decode path (M≤32)"
      description: "Latency-critical small-batch regime (M=1,8,16,32)"
    - label: "Prefill path (M=4096)"
      description: "Throughput-critical large-batch regime (M=4096)"

- key: baseline
  question: "What is the performance baseline to beat?"
  header: "Baseline"
  required: false
  multi: false
  default: "lmslim matmul_int8"
  options:
    - label: "lmslim matmul_int8"
      description: "lmslim.layers.gemm.int8_utils.matmul_int8 (Triton w8a8 baseline)"
    - label: "torch._scaled_mm"
      description: "PyTorch native scaled_mm (CUDA/ROCm backend)"
    - label: "rocBLAS"
      description: "AMD rocBLAS int8 GEMM"
    - label: "Hand-written ref"
      description: "A reference provided in notebooks/"

- key: dtype
  question: "Compute / storage dtype?"
  header: "Dtype"
  required: true
  multi: false
  default: "int8"
  options:
    - label: "fp16/bf16"
      description: "Half precision"
    - label: "fp8 (e4m3/e5m2)"
      description: "Hopper native"
    - label: "int8"
      description: "W8A8: int8 weight × int8 activation, bf16 output"
    - label: "int4"
      description: "W4A16"

- key: correctness_ref
  question: "What is the correctness reference?"
  header: "Reference"
  required: false
  multi: false
  default: "pytorch eager"
  options:
    - label: "PyTorch eager"
      description: "Compare against torch reference impl"
    - label: "vLLM/SGLang op"
      description: "Compare against the framework's existing op"
    - label: "Hand-written ref"
      description: "A reference provided in notebooks/"

- key: perf_target
  question: "What is the perf target? (free text, e.g. >=80% of cuBLAS, or >=2x torch.compile)"
  header: "Perf bar"
  required: false
  default: ">=80% of best reference"

- key: max_iterations
  question: "Max orchestrator iterations?"
  header: "Max iters"
  required: false
  multi: false
  default: "20"
  options:
    - label: "10"
      description: "Quick prototype"
    - label: "20"
      description: "Balanced (recommended)"
    - label: "50"
      description: "Deep tuning, multi-day"

- key: flow
  question: "Which Humanize-style search flow? (see docs.humanfia.ai/humanize)"
  header: "Flow"
  required: false
  multi: false
  default: "flame_chase"
  options:
    - label: "flame_chase"
      description: "Perf optimization: plateau -> structural REWRITE, else fine-tune. Default."
    - label: "ralph_loop"
      description: "Same task round after round in a fresh session until budget stops; no auto-rewrite."
    - label: "rlar"
      description: "Actor + fresh reviewer loop; reviewer notes drive the next plan."

- key: extra_notes
  question: "Extra constraints (e.g. must not use cublas, must be deterministic)?"
  header: "Notes"
  required: false
