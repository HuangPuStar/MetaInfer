- key: operator
  question: "Which operator will this task optimize? The concrete adapter contract is supplied when the operator is connected."
  header: "Operator"
  required: true
  multi: false
  default: "Quantized GEMM"
  options:
    - label: "Quantized GEMM"
      description: "INT8/BF16/FP16 matrix multiplication, including W8A8"
    - label: "Attention"
      description: "MHA, MQA, GQA or MLA kernels"
    - label: "RMSNorm / LayerNorm"
      description: "Normalization kernels"
    - label: "RoPE"
      description: "Rotary positional embedding"
    - label: "Custom operator"
      description: "An extracted DCU kernel with a custom adapter"

- key: kernel_language
  question: "Kernel implementation stack."
  header: "Stack"
  required: true
  multi: false
  default: "HIP C++"
  options:
    - label: "HIP C++"
      description: "Native DTK/HIP kernel for gfx928"
    - label: "PyTorch HIP extension"
      description: "HIP source loaded through a PyTorch extension"
    - label: "TileLang / Triton"
      description: "Generated kernel stack when supported by the target project"

- key: target_hardware
  question: "Target DCU platform."
  header: "Hardware"
  required: true
  multi: false
  default: "K500SM_AI / gfx928"
  options:
    - label: "K500SM_AI / gfx928"
      description: "worker29, four DCUs, wavefront 64"
    - label: "Other DCU"
      description: "Requires an explicit hardware adapter"

- key: dtype
  question: "Compute and storage dtype."
  header: "Dtype"
  required: true
  multi: false
  default: "INT8 W8A8"
  options:
    - label: "INT8 W8A8"
      description: "INT8 activation and weight"
    - label: "FP16 / BF16"
      description: "Half-precision floating point"
    - label: "Other"
      description: "Defined by the concrete operator adapter"

- key: agent_framework
  question: "Agent framework used by coordinator, kernel workers, repairs, synthesis, and validation."
  header: "Agent framework"
  required: true
  multi: false
  default: "ccb"
  options:
    - label: "ccb"
      description: "Claude Code (claude-sonnet-5 / claude-opus-5)"
    - label: "dsh"
      description: "DeepSeek Harness (deepseek-flash-4.1 / deepseek-v4-flash)"

- key: agent_model
  question: "Model used by the selected agent framework (ccb: Sonnet/Opus; dsh: deepseek-flash-4.1 / deepseek-v4-flash)."
  header: "Agent model"
  required: true
  multi: false
  default: "Opus"
  override_component: "agent-model"
  override_module: "app/dkao-agent-fields"
  options:
    - label: "Opus"
      description: "Pinned to Claude Opus 5 (claude-opus-5) for difficult kernel architecture and correctness work"
    - label: "Sonnet"
      description: "Pinned to Claude Sonnet 5 (claude-sonnet-5) for faster, lower-cost optimization runs"
    - label: "deepseek-flash-4.1"
      description: "DeepSeek Harness 4.1 Flash (deepseek/deepseek-flash) — current default DSH model"
    - label: "deepseek-v4-flash"
      description: "DeepSeek Harness V4 Flash, pinned build (deepseek/deepseek-v4-flash-0731)"

- key: execution_mode
  question: "Task execution mode for this run."
  header: "Mode"
  required: true
  multi: false
  default: "Generate & optimize (auto-create kernel repo)"
  options:
    - label: "Generate & optimize (auto-create kernel repo)"
      description: "Agent generates the complete kernel repo from scratch, then optimizes it. No pre-existing kernel code required."

- key: target_repo_path
  question: "Repository folder name under kernel-repos next to MetaInfer. Example: int8 test2 creates and directly uses kernel-repos/int8 test2."
  header: "Kernel repo"
  required: false
  form: text
  default: ""

- key: model
  question: "Which model's INT8 W8A8 GEMM workload will this task optimize? Shape selection is grouped by TP size (1/4/8)."
  header: "Model"
  required: true
  multi: false
  default: "DeepSeek V4 Flash"
  options:
    - label: "DeepSeek V4 Flash"
      description: "SGLang DeepSeek-V4-Flash Channel INT8 W8A8 (TP1/4/8), current default workload"
    - label: "Hy3 (Hunyuan 3)"
      description: "Hy3 Channel INT8 W8A8 via vLLM v0.18.0"
    - label: "MiniMax M3"
      description: "MiniMax M3 W8A8; currently not deployable for testing"
    - label: "GLM5.2"
      description: "GLM-5.2 INT4/INT8 mix via SGLang v0.5.15"

- key: validation_scope
  question: "最终串行验证范围：全量 API shapes（默认，含未优化 shape 的回归）或仅本次任务 shape（更快）"
  header: "Final validation"
  required: false
  form: select
  default: "All API shapes"
  options:
    - label: "All API shapes"
      description: "验证冻结 API 的每个 shape（含 fallback 回归）——最稳，但每题约 50-90 分钟"
    - label: "Task shapes only"
      description: "只验证本任务优化的 shape——快得多，适合只关心本次 shape 性能的场景"

- key: bench_profile
  question: "benchmark 采样密度：full 用资产默认(100/30/100)，quick 用较快且稳定的采样(30/30/50)"
  header: "Bench profile"
  required: false
  form: select
  default: "full"
  options:
    - label: "full"
      description: "默认高密度采样"
    - label: "quick"
      description: "轻量采样，串行验证更快（median/p90 略有噪声）"

- key: shape_assignment_mode
  question: "Choose whether the control plane or you assign shapes to physical GPUs."
  header: "Shape assignment"
  required: true
  multi: false
  default: "AI automatic"
  options:
    - label: "AI automatic"
      description: "The control plane deterministically balances exact shapes across available GPUs"
    - label: "Manual by GPU"
      description: "Use four GPU cards below to explicitly choose where every shape is optimized"

- key: shape_scope
  question: "Choose whether this task optimizes the complete API workload or only a selected subset."
  header: "Optimization scope"
  required: true
  multi: false
  default: "All API shapes"
  options:
    - label: "All API shapes"
      description: "Optimize every default shape exposed by the immutable operator API"
    - label: "Selected shapes only"
      description: "Optimize a task-sized subset; unselected shapes remain on the trusted fallback and are regression-tested"

- key: shape_config
  question: "Reads default optimization shapes from the fixed operator API. In manual mode, assign every shape to one GPU."
  header: "Workload"
  required: false
  form: textarea
  default: ""
  override_component: "shape-input"
  override_module: "app/dkao-shape-input"

- key: correctness_ref
  question: "Trusted correctness reference owned by the MetaInfer adapter."
  header: "Reference"
  required: true
  multi: false
  default: "PyTorch eager"
  options:
    - label: "PyTorch eager"
      description: "Compare with a deterministic PyTorch implementation"
    - label: "SGLang operator"
      description: "Compare with the extracted SGLang reference path"
    - label: "Adapter-provided reference"
      description: "The concrete adapter supplies the immutable reference"

- key: perf_target
  question: "Optional performance target, for example >=1.2x baseline."
  header: "Perf bar"
  required: false
  default: "Improve stable median without P90 regression"

- key: max_iterations
  question: "Maximum optimization rounds per worker."
  header: "Max iters"
  required: true
  multi: false
  default: "5"
  options:
    - label: "1"
      description: "Single-round validation"
    - label: "3"
      description: "Quick MVP exercise"
    - label: "5"
      description: "Default"
    - label: "10"
      description: "Longer optimization loop"
    - label: "20"
      description: "Extended exploration"

- key: minimum_improvement_percent
  question: "Final target improvement over the fixed baseline. This is not the per-round candidate acceptance threshold."
  header: "Final improve"
  required: true
  form: number
  default: 1.0

- key: extra_notes
  question: "Additional constraints, such as determinism or forbidden libraries."
  header: "Notes"
  required: false
  form: textarea

- key: execution_profile
  question: "执行画像：production = 生产任务（走 broker 的最高优先级、排在 HE 之前；仍然必须过 VRAM<=90%/HCU==0 的准入闸门，因为共享卡上的测量是脏数据）；default = 现状"
  header: "Profile"
  required: false
  form: select
  default: "default"
  options:
    - label: "default"
      description: "与现状一致（调控/占据模式按 gpu_mode 决定）"
    - label: "production"
      description: "生产模式：优先级 100 插队、优先派发，仍过闸门、不用等 HE 的轮次"

