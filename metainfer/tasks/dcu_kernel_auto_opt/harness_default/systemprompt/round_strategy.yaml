schema_version: 1
component: systemprompt
status: seed
wired: true
role: >-
  Per-round mandate wording handed to the optimization worker ("what to try
  this round"). The decision logic stays in
  orchestrator/round_strategy.py + prompts.py: measured history, ISA phase, PMC
  evidence and the M regime select the branch. This file only carries the text
  of each branch, so the Evolve loop can version and evolve the instructions
  without making the round-selection state machine writable.
loader: orchestrator/round_strategy.load_round_strategy
read_at_runtime: >-
  orchestrator/prompts.py::w8a8_round_strategy, reached from
  orchestrator/w8a8_pipeline.py (planner disabled, and the planner's
  legacy_menu deferral). DKAO reads it through METAINFER_HARNESS_ROOT.
format_fields: >-
  Templates may use these str.format fields only: {iteration}, {speedup},
  {artifact_dir}, {completed}, {split_candidates}, {grid_blocks}, {cu_count}.
  An unknown field makes that one suffix fall back to the built-in text
  instead of raising, so a malformed harness degrades to a weaker instruction
  rather than breaking a round.
drift_guard: tests/test_round_strategy.py::test_seed_matches_builtin_defaults

# P0 repairs: a broken previous attempt outranks any exploration plan.
repair:
  faster_wrong: >-
    Highest priority: repair the faster but incorrect candidate from iteration
    {iteration} (measured speedup {speedup}x). Read its archived source at
    `{artifact_dir}` and preserve the fast mapping. Fix only the smallest
    correctness defect: signed int8 unpacking, tail bounds, scale indexing,
    bf16 conversion, or a race. Do not replace it with an unrelated
    architecture.
  infrastructure_failure: >-
    The preceding attempt failed in the agent infrastructure. Return to the
    accepted best source and start a new bounded experiment; do not repair or
    replay a partially written candidate. This failure does not count as a
    completed optimization round.
  build_failure: >-
    Repair the immediately preceding candidate from iteration {iteration} at
    `{artifact_dir}`. Keep its strategy and make only the minimum
    compile/API/syntax correction; do not start another redesign this round.

# P1 phase gates: the ISA-gated rounds, chosen by the control plane.
phases:
  isa_guided_hip: >-
    ISA-guided HIP round. This is successful ISA experiment {completed} of at
    least 2. Select one measured memory or compute bottleneck, compare the
    exact primary-kernel ISA with the preceding code object, and make one
    HIP/DUMMA/intrinsic code-shaping change. Raw inline asm remains forbidden.
    Record a compiler limitation only when the before/after binary proves it
    and name the exact target instructions.
  conditional_inline_asm: >-
    Conditional inline-asm experiment. Target only the compiler limitation and
    exact instructions verified by the immediately preceding ISA-guided HIP
    round. Keep the asm block minimal, preserve complete constraints/clobbers,
    and reject it unless the candidate ISA, exact correctness, median, P90, and
    resources all validate. Do not write raw global/buffer/flat loads or MMAC.

# Evidence-qualified suffixes appended to a portfolio mandate.
append:
  split_candidates: >-
    Trusted occupancy-probe split candidates for the measured CU count are
    {split_candidates}. They include non-power-of-two values where useful, are
    not a whitelist, and must fit the workspace and stage-alignment
    constraints. Explore outside this set when evidence supports it.
  grid_warning: >-
    Trusted control-plane warning: current grid has {grid_blocks} blocks for
    {cu_count} CUs, below the two-blocks-per-CU latency-hiding target. Before
    micro-optimization, benchmark a finer one-wave zero-barrier grid or
    multiple legal split-K candidates including combine cost.

# Portfolios: the mandate for each round index, per M regime.
#   small = M < 16, m16 = 16 <= M < 128, large = M >= 128.
# late_start = max(9, max_iterations - 1): rounds before it use the numbered
# slot below; from it on, slot 9 is used while iteration < max_iterations and
# slot 10 on the final round. The small regime stops at slot 8 and keeps that
# consolidation mandate to the end.
portfolios:
  small:
    "1": Vectorize contiguous K loads with exact signed-int8 semantics.
    "2": >-
      Increase instruction-level parallelism with independent int32
      accumulators or adjacent N outputs; avoid per-K-tile LDS barriers.
    "3": >-
      Stage all of tiny A once with at most one barrier, or tune unroll one
      step if whole-A staging is not cheaper.
    "4": >-
      Change one launch variable only: waves per block, N columns per wave, or
      unroll factor.
    "5": >-
      HIP-only memory round: change one vector-load width, contiguous N
      mapping, or whole-A reuse decision. Raw inline asm is forbidden.
    "6": >-
      HIP-only pipeline round: reduce one dependency chain or barrier using
      ordinary HIP/intrinsics. Raw inline asm is forbidden.
    "7": >-
      HIP-only resource round: tune one block size, unroll factor, or live
      range while preserving coalescing. Raw inline asm is forbidden.
    "8": >-
      HIP-only consolidation round: revisit the fastest correct archived
      mapping and make one final architecture/codegen improvement. Raw inline
      asm is forbidden.
  m16:
    "1": >-
      Establish a minimal 16x16x32 DUMMA tile with the exact API below, one
      wave per output tile and explicit int32 accumulation. If the seed already
      has a correct DUMMA kernel, preserve it and instead test the smallest
      one-wave-per-block, one-N-tile geometry with no cross-wave barrier; do
      not spend the round reimplementing it.
    "2": >-
      Architecture round: measure grid parallelism before polishing. Explore
      one complete launch geometry among 1/2/4 waves per block and 1/2/4
      adjacent N tiles. Prefer enough independent blocks to cover at least all
      device CUs; report grid_blocks, waves_per_block and estimated_active_cus
      in proposal.json.
    "3": >-
      Architecture round: if the unsplit grid has fewer than two blocks per
      device CU and K >= 1024, implement and measure split-K=2 plus at least
      one CU-aligned candidate (which may be non-power-of-two), or test a
      one-wave zero-barrier geometry that reaches the same parallelism. Write
      int32 partials into the caller workspace and include the combine+scale
      kernel in the timed Graph.
    "4": >-
      Architecture/pipeline round: explore one of multi-N-tile reuse, A-only
      staging, or bounded register/LDS prefetch. Retain enough blocks to cover
      all CUs, state which A/B bytes are reused, and measure whether the change
      improves normal median/P90.
    "5": >-
      HIP-only packed-weight/staging round: compare one packed layout, A-only
      staging, or B-only staging design. Raw inline asm is forbidden.
    "6": >-
      Pipeline round: choose exactly one staging family from direct, A-only
      LDS, B-only LDS, or A+B LDS using L2/VMEM evidence. Use coalesced 8- or
      16-byte cooperative loads and report HBM/LDS byte changes; do not claim
      asynchronous overlap without evidence.
    "7": >-
      Pipeline round: compare single buffering with double buffering only when
      K>=1024, L2 hit rate is below 70%, and the doubled LDS budget stays below
      48 KiB. Count barriers per K step.
    "8": >-
      HIP-only resource round: tune one occupancy limiter using actual PMC
      evidence: waves per block, VGPR live range, LDS footprint, or spill
      removal. Do not trade repeated HBM reads for occupancy.
    "9": >-
      Late ISA-diagnosis round. Only if the control-plane plateau gate is open,
      use one selected ISA Skill and trusted disassembly to shape compiler
      output through HIP/DUMMA/intrinsics. Raw inline asm remains forbidden.
      Otherwise continue HIP-only exploration.
    "10": >-
      Final conditional inline-asm round. Raw asm is allowed only when the
      control plane confirms a HIP plateau and the prior ISA-guided round
      recorded one concrete compiler limitation plus target instructions.
      Otherwise make one HIP-only consolidation change.
  large:
    "1": >-
      Establish a correct DUMMA throughput baseline using a 2-D macro-tile.
      Benchmark 64x64, 64x128, and 128x64 block tiles; record waves per block,
      VGPRs, LDS bytes, occupancy and TOPS.
    "2": >-
      Operand-reuse round: compare direct loads with cooperative A+B LDS
      staging. Quantify A/B reuse per macro-tile and use vectorized coalesced
      global loads with a bank-safe LDS layout.
    "3": >-
      Pipeline round: compare single and double buffering across K tiles.
      Retain double buffering only when ISA/PMC evidence shows reduced VMEM
      stalls without harmful LDS or occupancy growth.
    "4": >-
      Tile-shape round: tune M-tile versus N-tile aspect ratio for this exact
      M/N/K, balancing B reuse, A reuse and enough blocks to occupy every CU.
      Do not inherit decode launch geometry.
    "5": >-
      Packing round: test one weight packing/swizzle that makes each DUMMA B
      tile vector-loadable and LDS-bank-safe. Include packing outside timing
      and validate the graph-stable packed layout.
    "6": >-
      Epilogue round: fuse per-row and per-column scales, bf16 conversion and
      the final coalesced store into the compute kernel; remove any
      unnecessary workspace/combine pass.
    "7": >-
      Compute-pipeline round: tune DUMMA issue grouping, prefetch distance and
      accumulator independence using ISA stall evidence. Raw inline asm
      remains forbidden.
    "8": >-
      Resource round: tune waves per block, VGPR live ranges and LDS footprint
      from measured occupancy. Recheck the best tile family with normal
      median/P90 measurements.
    "9": >-
      Late ISA-diagnosis round. Only if the control-plane plateau gate is open,
      use one selected ISA Skill and trusted disassembly to shape compiler
      output through HIP/DUMMA/intrinsics. Raw inline asm remains forbidden.
      Otherwise continue HIP-only exploration.
    "10": >-
      Final conditional inline-asm round. Raw asm is allowed only when the
      control plane confirms a HIP plateau and the prior ISA-guided round
      recorded one concrete compiler limitation plus target instructions.
      Otherwise make one HIP-only consolidation change.
notes: >-
  These texts are byte-identical to the Python literals they replaced
  (orchestrator/round_strategy.py BUILTIN_STRATEGY), so an un-evolved harness
  behaves exactly as before. Editing this file now changes the round
  instructions the worker receives, and the Evolve loop can version it.
  A key omitted here keeps its built-in text; an unknown regime or slot is
  reported in RoundStrategy.notes and ignored.
